# SwarmACB - learned Option-Critic Phase 2 x Directional Gate x Cyclamen

behaviors:
  OC2_DirGate_cyclamen:
    task: SwarmACB-DirectionalGate-v0
    variant: cyclamen
    trainer_type: learned_option_critic

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      intra_option_coef: 1.0
      selector_coef: 1.0
      local_option_value_coef: 0.5
      option_entropy_coef: 0.005
      termination_penalty: 0.01
      termination_coef: 1.0
      termination_entropy_coef: 0.0
      initial_termination_probability: 0.05
      value_coef: 0.5
      action_baseline_coef: 0.25
      option_value_coef: 0.5
      option_baseline_coef: 0.25
      attention_diversity_coef: 0.01
      attention_temporal_coef: 0.01
      initial_log_std: -0.7
      min_log_std: -2.5
      max_log_std: 0.0
      max_grad_norm: 10.0
      option_value_temperature: 1.0
      learning_rate_schedule: linear
      epsilon_schedule: linear
      beta_schedule: linear

    network_settings:
      hidden_units: 128
      num_layers: 1
      option_hidden_units: 512
      option_num_layers: 2
      num_options: 6
      memory:
        memory_size: 128
        option_memory_size: 64
        sequence_length: 128

    critic_settings:
      hidden_units: 512
      num_layers: 2
      num_heads: 4

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 120000000
    time_horizon: 1000
    summary_freq: 120000
    checkpoint_interval: 120000
    keep_checkpoints: 5

    environment:
      num_envs: 5
      decision_period: 1
      episode_length_s: 120.0
