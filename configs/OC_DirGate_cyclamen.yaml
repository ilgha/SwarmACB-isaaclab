# SwarmACB - fixed-module Option-Critic x Directional Gate x Cyclamen
#
# Phase 1: options are the six predefined ACB behavior modules.
# The learner trains option selection, Q_Omega, and termination.
#
# Launch with:
#   python scripts/train.py --config configs/OC_DirGate_cyclamen.yaml --headless

behaviors:
  OC_DirGate_cyclamen:
    task: SwarmACB-DirectionalGate-v0
    variant: cyclamen
    trainer_type: option_critic

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      termination_penalty: 0.01
      termination_coef: 0.1
      termination_entropy_coef: 0.001
      option_value_coef: 0.5
      baseline_coef: 0.25
      learning_rate_schedule: linear
      epsilon_schedule: linear
      beta_schedule: linear

    network_settings:
      hidden_units: 128
      num_layers: 1
      num_options: 6
      memory:
        memory_size: 128
        sequence_length: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 120000000
    time_horizon: 1000
    summary_freq: 120000
    checkpoint_interval: 120000
    keep_checkpoints: 5

    environment:
      num_envs: 5
      decision_period: 1
      episode_length_s: 120.0
